# LoRA 训练配置（mlx_lm lora -c lora_config.yaml）
model: mlx-community/Qwen3-1.7B-bf16
train: true
data: data/sft
adapter_path: adapters

fine_tune_type: lora
# 只在"答案"部分算损失：提示词每条都一样，没必要让模型学着复述它
mask_prompt: true
# 给全部 28 层加 LoRA
num_layers: -1
lora_parameters:
  # rank：LoRA 小矩阵的宽度。越大能学的越多，但参数和过拟合风险也越大
  rank: 16
  scale: 20.0
  dropout: 0.05

optimizer: adamw
learning_rate: 1.0e-4
batch_size: 8
# 约 1900 条训练数据 / 每批 8 条 ≈ 240 步一轮，这里训 3 轮
iters: 720
max_seq_length: 1024
grad_checkpoint: true

steps_per_report: 10
steps_per_eval: 60
val_batches: -1
save_every: 120
seed: 42
