<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方面标注</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --text: #1d1c1a; --muted: #6d6a63;
    --border: #e2dfd8; --accent: #3b5bdb; --accent-soft: #e7ecff;
    --pos: #1f8a4c; --pos-soft: #e3f4ea; --neg: #c2412d; --neg-soft: #fbe7e3; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --surface: #1e1e1b; --surface-2: #272724; --text: #ecebe6; --muted: #9c998f;
      --border: #34332f; --accent: #8ea6ff; --accent-soft: #252c47;
      --pos: #5cc98a; --pos-soft: #1b3326; --neg: #f08470; --neg-soft: #3a211c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-top: 16px; }
  .who { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .who button, .nav button { font: inherit; font-size: 14px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 16px; cursor: pointer; }
  .who button:hover { border-color: var(--accent); }
  .progress { margin-top: 18px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .tag { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; }
  .saved-tag { color: var(--pos); }
  .review { font-size: 19px; line-height: 1.8; margin: 14px 0 0; word-break: break-word; }
  .hint { font-size: 13px; color: var(--muted); margin: 14px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 8px; }
  .asp { text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; cursor: pointer; line-height: 1.35; }
  .asp:hover { border-color: var(--accent); }
  .asp b { font-size: 14px; display: block; }
  .asp small { font-size: 11px; color: var(--muted); }
  .asp .state { float: right; font-size: 12px; font-weight: 600; }
  .asp.pos { background: var(--pos-soft); border-color: var(--pos); }
  .asp.pos .state { color: var(--pos); }
  .asp.neg { background: var(--neg-soft); border-color: var(--neg); }
  .asp.neg .state { color: var(--neg); }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 8px; flex-wrap: wrap; }
  .nav .primary { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .nav .primary { color: #111; } }
  .nav button:disabled { opacity: .4; cursor: default; }
  .status { font-size: 13px; color: var(--muted); }
  .err { color: var(--neg); }
  .rules { font-size: 13px; color: var(--muted); }
  .rules summary { cursor: pointer; color: var(--text); font-weight: 600; }
  .rules ul { padding-left: 18px; margin: 8px 0 0; }
  .rules dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 10px 0 0; }
  .rules dt { color: var(--text); font-weight: 600; }
  .rules dd { margin: 0; }
  .ex { margin-top: 8px; }
  .done { text-align: center; padding: 24px 8px; }
  .done h2 { margin: 0 0 8px; color: var(--pos); }
</style>
</head>
<body>
<main>
  <h1>方面标注</h1>
  <p class="sub">读评论，选出它具体评价了哪些方面、每个方面是好评还是差评。你的标注就是"标准答案"，用来检验模型。</p>
  <div id="app"></div>
  <details class="card rules" id="rules"><summary>标注规则和方面定义（先读一遍）</summary><div id="rules-body"></div></details>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NEXT = { undefined: "正面", "正面": "负面", "负面": undefined };
let guide, who = null, items = [], labels = {}, pos = 0, cur = {};

async function init() {
  guide = await fetch("/api/guide").then((r) => r.json());
  $("rules-body").innerHTML = `
    <ul><li>每个方面最多选一次；同一方面既有好评又有差评时，选评论里更主要的那个</li>
      <li>只有说到了具体属性才选；"东西很好""很满意""垃圾"这种完全笼统的评价不选任何方面，点"没有具体方面"</li>
      ${guide.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
    <dl>${guide.aspects.map((a) => `<dt>${esc(a.name)} · ${esc(a.en)}</dt><dd>${esc(a.desc)}</dd>`).join("")}</dl>
    <p><b>示例</b></p>${guide.examples.map((e) => `<div class="ex">“${esc(e.text)}” → ${
      e.aspects.length ? e.aspects.map((a) => `${esc(a["方面"])}（${esc(a["情感"])}）`).join("、") : "没有具体方面"}</div>`).join("")}`;
  let saved = null;
  try { saved = localStorage.getItem("aspect-annotator"); } catch (e) {}
  if (saved && guide.annotators.includes(saved)) return pick(saved);
  renderWho();
}

function renderWho() {
  $("app").innerHTML = `<section class="card"><b>你是哪位组员？</b>
    <div class="who">${guide.annotators.map((a) => `<button data-a="${esc(a)}">${esc(a)}</button>`).join("")}</div></section>`;
  document.querySelectorAll(".who button").forEach((b) => (b.onclick = () => pick(b.dataset.a)));
}

async function pick(a) {
  who = a;
  try { localStorage.setItem("aspect-annotator", a); } catch (e) {}
  const data = await fetch(`/api/items?annotator=${encodeURIComponent(a)}`).then((r) => r.json());
  items = data.items; labels = data.labels;
  const first = items.findIndex((it) => !(String(it.gid) in labels));
  pos = first < 0 ? items.length : first;
  render();
}

function render(status = "") {
  const n = Object.keys(labels).length;
  const head = `<div class="progress"><span>${esc(who)} · 已标 ${n} / ${items.length}</span><div class="bar"><div style="width:${(100 * n) / Math.max(1, items.length)}%"></div></div>
    <button class="tag" id="switch" style="cursor:pointer">换人</button></div>`;
  if (pos >= items.length) {
    const missing = items.length - n;
    $("app").innerHTML = head + `<section class="card done"><h2>${missing ? `还有 ${missing} 条没标` : "全部标完了 🎉"}</h2>
      <p class="sub">结果已保存在 cdt503/data/aspect_gold_${esc(who)}.jsonl</p>
      <div class="nav" style="justify-content:center"><button id="back">回去检查</button></div></section>`;
    $("back").onclick = () => { pos = Math.max(0, items.findIndex((it) => !(String(it.gid) in labels))); render(); };
    $("switch").onclick = renderWho;
    return;
  }
  const it = items[pos];
  const savedList = labels[String(it.gid)];
  cur = Object.fromEntries((savedList || []).map((a) => [a["方面"], a["情感"]]));
  $("app").innerHTML = head + `<section class="card">
    <div class="meta"><span class="tag">${esc(it.cat)} · ${esc(it.cat_en)}</span><span>第 ${pos + 1} 条</span>
      ${savedList ? `<span class="saved-tag">已保存（${savedList.length ? savedList.length + " 个方面" : "没有具体方面"}）</span>` : ""}</div>
    <p class="review">${esc(it.text)}</p>
    <p class="hint">点一下 = 好评，再点 = 差评，第三下 = 取消</p>
    <div class="grid">${guide.aspects.map((a) => `
      <button class="asp" data-a="${esc(a.name)}" title="${esc(a.desc)}">
        <span class="state"></span><b>${esc(a.name)}</b><small>${esc(a.en)}</small></button>`).join("")}</div>
    <div class="nav">
      <button id="prev" ${pos === 0 ? "disabled" : ""}>← 上一条</button>
      <span class="status" id="status">${status}</span>
      <span style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="none">没有具体方面</button>
        <button id="save" class="primary">保存，下一条 ↵</button></span>
    </div></section>`;
  document.querySelectorAll(".asp").forEach((b) => (b.onclick = () => { cur[b.dataset.a] = NEXT[cur[b.dataset.a]]; paint(); }));
  $("prev").onclick = () => { pos--; render(); };
  $("none").onclick = () => { cur = {}; save(); };
  $("save").onclick = save;
  $("switch").onclick = renderWho;
  paint();
}

function paint() {
  document.querySelectorAll(".asp").forEach((b) => {
    const s = cur[b.dataset.a];
    b.className = "asp" + (s === "正面" ? " pos" : s === "负面" ? " neg" : "");
    b.querySelector(".state").textContent = s ? (s === "正面" ? "好评 +" : "差评 −") : "";
  });
}

async function save() {
  const it = items[pos];
  const aspects = Object.entries(cur).filter(([, s]) => s).map(([a, s]) => ({ "方面": a, "情感": s }));
  if (!aspects.length && !confirm("这条没有选任何方面，确定是\"没有具体方面\"吗？")) return;
  try {
    const res = await fetch("/api/label", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ annotator: who, gid: it.gid, aspects }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    labels[String(it.gid)] = aspects;
    pos++;
    render(`<span style="color:var(--pos)">已保存</span>`);
  } catch (e) {
    $("status").innerHTML = `<span class="err">保存失败：${esc(e.message)}</span>`;
  }
}

document.addEventListener("keydown", (e) => {
  if (!who || pos >= items.length) return;
  if (e.key === "Enter" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); save(); }
});
init();
</script>
</body>
</html>
